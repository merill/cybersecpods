name: Update Apple Ratings (daily)

on:
  schedule:
    # Daily at 06:00 UTC
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-ratings
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - name: Install Chromium for browser fetch fallback
        # Used by the rebake step below so Substack-style hosts behind
        # Cloudflare bot-management can still be fetched from CI runners.
        run: npx playwright install --with-deps chromium

      - name: Refresh Apple ratings
        run: npm run update:ratings

      - name: Re-bake ratings into podcasts.json
        run: npm run update:podcasts

      - name: Commit & push (if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "@data/ratings.json" "@data/podcasts.json" "@data/episodes" "public/podcasts-index.json" || true
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "chore(data): refresh apple ratings"
          git push
