name: Update Podcasts (hourly)

on:
  schedule:
    # Hourly at :15
    - cron: "15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-podcasts
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - name: Install Chromium for browser fetch fallback
        # Used by @build/lib/rss.ts to bypass Cloudflare bot-management on
        # Substack-style hosts. Skipped automatically if playwright-core
        # isn't present.
        run: npx playwright install --with-deps chromium

      - name: Refresh podcast metadata + episodes
        run: npm run update:podcasts

      - name: Commit & push (if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "@data/podcasts.json" "@data/episodes" "public/podcasts-index.json" || true
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "chore(data): refresh podcasts + episodes"
          git push
