name: Validate PR Submission

on:
  pull_request:
    paths:
      - "@data/podcasts/**.json"

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine changed input files
        id: changes
        run: |
          set -e
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          FILES=$(git diff --name-only --diff-filter=AM "$BASE" "$HEAD" -- '@data/podcasts/*.json' | tr '\n' ' ')
          echo "files=$FILES" >> "$GITHUB_OUTPUT"
          echo "Changed input files: $FILES"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - name: Run validator
        id: validate
        if: steps.changes.outputs.files != ''
        env:
          CHANGED_FILES: ${{ steps.changes.outputs.files }}
          VALIDATION_OUTPUT: validation-output.json
        run: |
          set +e
          npm run validate:input
          STATUS=$?
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Build PR comment body
        if: steps.changes.outputs.files != ''
        id: comment
        run: |
          if [ ! -f validation-output.json ]; then
            echo "No validation output file, skipping."
            echo "skip=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          node -e '
            const fs = require("fs");
            const data = JSON.parse(fs.readFileSync("validation-output.json","utf8"));
            const issues = data.issues ?? [];
            let body = "";
            if (!issues.length) {
              body = "### ✅ Podcast submission validation passed\n\nAll changed files in this PR look good. The build will pick them up after merge.";
            } else {
              const grouped = {};
              for (const i of issues) (grouped[i.file] ??= []).push(i.error);
              body = "### ❌ Podcast submission validation failed\n\n";
              for (const [file, errs] of Object.entries(grouped)) {
                body += `**\`${file}\`**\n`;
                for (const e of errs) body += `- ${e}\n`;
                body += "\n";
              }
              body += "Please fix and push again. See `README.md` for the submission schema.";
            }
            fs.writeFileSync("comment.md", body);
          '
          echo "skip=0" >> "$GITHUB_OUTPUT"

      - name: Post PR comment
        if: steps.changes.outputs.files != '' && steps.comment.outputs.skip != '1'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: cybersecpods-validation
          path: comment.md

      - name: Fail job on validation errors
        if: steps.changes.outputs.files != '' && steps.validate.outputs.status != '0'
        run: |
          echo "Validation failed; see PR comment for details."
          exit 1
